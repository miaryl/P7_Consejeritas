<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consejitos del día</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Jeju+Hallasan&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img class="logo" src="img/logo.png" alt="logo de Consejitos del día">
        <h1>Consejito del día</h1>
    </header>
    <main>
      <section id="consejitosSection">
        <p id="fact">Sorpréndete</p>
        <button id="fetchBtn">Consejito</button>
        <button id="favoriteBtn">⭐</button>
        <button id="viewFavoritesBtn">Ver Favoritos</button>
    </section>
    <section id="favoritesSection" class="favoriteSection">
      <h1>⭐ Tus consejitos favoritos</h1>
      <div id="favoritesList"></div>
      <button id="backBtn">⬅️ Volver</button>
  </section>
    </main>
    <footer>
        <section class="social-media">
          <nav class="icons">
            <img src="img/ig.png" alt="Instagram" />
            <img src="img/fb.png" alt="Facebook" />
            <img src="img/mail.png" alt="Email" />
          </nav>
          <p>&copy; 2025 Equipo Consejistas</p>
        </section>
      </footer>
      <script src="./main.js"></script>
      <script src="favourite.js"></script>

</body>
</html>
